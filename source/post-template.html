title: 文章模板

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="dynamic-title">文章 · SYLVIE</title>
    
    <style>
    @font-face {
        font-family: 'WK-M';
        src: url('/font/WK-M.woff') format('woff');
        font-display: swap;
    }

    /* ===== 1. CSS变量 - 浅色模式 ===== */
    :root {
        /* 浅色模式 - 与blog-custom保持一致 */
        --bg-body: #3171dc;
        --bg-wrapper: #7db9de;
        --bg-card: #ffffff;
        --text-primary: #7db9de;
        --text-secondary: #7db9de;
        --text-muted: #7db9de;
        --text-nav: #7db9de;
        --border-color: #f2f4f8;
        --accent-color: #808080;
        --accent-hover: #b8864a;
        --card-shadow: 0 2px 12px rgba(44, 62, 80, 0.06);
        --loading-bg: rgba(44, 62, 80, 0.04);
        --error-color: #c0392b;
        --post-title: #2c3e50;
        --post-title-hover: #1a2a3a;
        --post-date: #7a8a9e;
        --progress-bg: #f2f4f8;
        --stat-text: #7a8a9e;
        --site-title: #2c3e50;
        --theme-border-color: rgba(44, 62, 80, 0.3);
        --theme-hover-bg: rgba(128, 128, 128, 0.12);
        /* 文章内容颜色 */
        --content-text: #2c3e50;
        --content-heading: #2c3e50;
        --content-blockquote-bg: rgba(44, 62, 80, 0.06);
        --content-blockquote-border: #808080;
        --content-code-bg: rgba(44, 62, 80, 0.06);
        --content-code-color: #c0392b;
        --content-pre-bg: rgba(44, 62, 80, 0.04);
        --content-link: #808080;
        --content-link-hover: #b8864a;
    }

    /* ===== 2. 深色模式 ===== */
    html.dark {
        --bg-body: #1e2024;
        --bg-wrapper: #1e2024;
        --bg-card: #25282e;
        --text-primary: #d4d8e0;
        --text-secondary: #c0c6d0;
        --text-muted: #a8b0be;
        --text-nav: #d4d8e0;
        --border-color: #3a3e45;
        --accent-color: #d4d8e0;
        --accent-hover: #e0aa77;
        --card-shadow: none;
        --loading-bg: rgba(255, 255, 255, 0.04);
        --error-color: #ff6b6b;
        --post-title: #d4d8e0;
        --post-title-hover: #ffffff;
        --post-date: #a8b0be;
        --progress-bg: #3a3e45;
        --stat-text: #a8b0be;
        --site-title: #d4d8e0;
        --theme-border-color: rgba(255, 255, 255, 0.25);
        --theme-hover-bg: rgba(209, 154, 102, 0.15);
        /* 深色文章内容颜色 */
        --content-text: #c8d0dc;
        --content-heading: #d4d8e0;
        --content-blockquote-bg: rgba(255, 255, 255, 0.04);
        --content-blockquote-border: #d4d8e0;
        --content-code-bg: rgba(255, 255, 255, 0.08);
        --content-code-color: #e0a080;
        --content-pre-bg: rgba(0, 0, 0, 0.3);
        --content-link: #d4d8e0;
        --content-link-hover: #e0aa77;
    }

    /* ===== 3. 全局样式 ===== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        font-family: "Helvetica Neue", "Helvetica", "Arial", "Hei", "Microsoft YaHei", "PingFang SC", sans-serif;
        background-color: var(--bg-body);
        color: var(--text-primary);
        line-height: 1.7;
        transition: background-color 0.4s ease, color 0.4s ease;
    }

    .page-wrapper {
        background-color: var(--bg-wrapper);
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        transition: background-color 0.4s ease;
    }

    .main-card {
        width: 100%;
        max-width: 800px;
        background-color: var(--bg-card);
        padding: 22px 48px;
        margin: 0 auto;
        border-radius: 12px;
        box-shadow: var(--card-shadow);
        transition: background-color 0.4s ease, box-shadow 0.4s ease;
    }

    .top-section {
        margin-bottom: 8px;
        position: relative;
    }

    /* ===== 顶部行：文章标题 + 主题按钮 ===== */
    .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        width: 100%;
        gap: 12px;
    }

    .article-title-header {
        font-size: 0.97rem;
        font-weight: 600;
        color: var(--post-title);
        text-align: left;
        opacity: 0.95;
        word-break: break-word;
        line-height: 1.4;
        flex: 1;
        min-width: 0;
        transition: color 0.4s ease;
        margin-top: 0px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .article-title-header .title-icon {
        width: 28px;
        height: 28px;
        border-radius: 4px;
        flex-shrink: 0;
        color: var(--post-title);
    }

    .article-title-header .title-text {
        flex: 1;
        min-width: 0;
        word-break: break-word;
    }

    /* ===== 主题切换按钮 - 正方形虚线框 ===== */
    #theme-toggle {
        cursor: pointer;
        user-select: none;
        font-size: 1.0rem;
        border: 1.5px dashed var(--theme-border-color);
        background: none;
        padding: 0;
        border-radius: 4px;
        transition: all 0.3s ease;
        color: var(--text-nav);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 27px;
        height: 27px;
        flex-shrink: 0;
        line-height: 1;
    }

    #theme-toggle:hover {
        background-color: var(--theme-hover-bg);
        border-color: var(--accent-color);
        transform: scale(1.05);
        color: var(--accent-color);
    }

    #theme-toggle:active {
        transform: scale(0.92);
    }

    #theme-icon {
        display: inline-block;
        transition: transform 0.3s ease;
    }

    #theme-toggle:hover #theme-icon {
        transform: rotate(20deg);
    }

    /* ===== 进度条 ===== */
    .progress-container {
        width: 100%;
        height: 1.5px;
        background-color: var(--progress-bg);
        margin-bottom: 12px;
        transition: background-color 0.4s ease;
    }

    .progress-bar {
        height: 1.5px;
        background-color: var(--accent-color);
        width: 0%;
        transition: width 0.1s ease;
    }

    /* ===== 导航菜单 ===== */
    .nav-menu {
        display: flex;
        gap: 15px;
        margin: 0;
        padding: 0;
        align-items: center;
        flex-wrap: wrap;
        margin-top: -4px;
    }

    .nav-link {
        padding: 2px 0;
        text-decoration: none;
        color: var(--text-nav);
        font-size: 0.97rem;
        font-weight: 650;
        transition: all 0.25s ease;
        letter-spacing: 0.5px;
        border-bottom: 1px solid transparent;
    }

    .nav-link:hover {
        color: var(--accent-color);
    }

    .nav-link.active {
        color: var(--accent-color);
        border-bottom-color: var(--accent-color);
    }

    /* ===== 文章内容 ===== */
    .post-content {
        margin-top: 20px;
        color: var(--content-text);
        font-family: "WK-M", "Microsoft YaHei", "Helvetica", "Arial", "Hei", sans-serif;
        font-size: 1.1rem;
        line-height: 2.4;
        transition: color 0.4s ease;
    }

    .post-content h1,
    .post-content h2,
    .post-content h3,
    .post-content h4 {
        color: var(--content-heading);
        margin: 1.5em 0 0.8em;
        font-weight: 500;
        transition: color 0.4s ease;
    }

    .post-content p {
        margin-bottom: 1.2em;
        line-height: 1.8;
        text-align: left;
    }

    .post-content img {
        max-width: 100%;
        height: auto;
        border-radius: 0 !important;
        margin: 1.5em 0;
    }

    .post-content blockquote {
        margin: 1.5em 0;
        padding: 1em 1.5em;
        background-color: var(--content-blockquote-bg);
        border-left: 4px solid var(--content-blockquote-border);
        border-radius: 4px;
        color: var(--text-secondary);
        transition: background-color 0.4s ease, color 0.4s ease;
    }

    .post-content code {
        background-color: var(--content-code-bg);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.9em;
        color: var(--content-code-color);
        transition: background-color 0.4s ease, color 0.4s ease;
    }

    .post-content pre {
        background-color: var(--content-pre-bg);
        padding: 1em;
        border-radius: 12px;
        overflow-x: auto;
        margin: 1.5em 0;
        transition: background-color 0.4s ease;
    }

    .post-content pre code {
        background-color: transparent;
        color: var(--text-primary);
    }

    .post-content a {
        color: var(--content-link);
        text-decoration: none;
        border-bottom: 1px solid rgba(128, 128, 128, 0.3);
        transition: color 0.3s ease;
    }

    .post-content a:hover {
        color: var(--content-link-hover);
        border-bottom-color: var(--content-link-hover);
    }

    .post-content ul,
    .post-content ol {
        margin: 1em 0 1em 1.5em;
    }

    .post-content li {
        margin-bottom: 0.5em;
    }

    /* ===== 文章底部：分类 + 标签 ===== */
    .article-footer {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid var(--border-color);
        display: flex !important;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        width: 100%;
        transition: border-color 0.4s ease;
    }

    .category-container {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
    }

    .category-icon-wrapper {
        display: flex;
        align-items: center;
        margin-right: 4px;
    }

    .category-icon {
        width: 18px;
        height: 18px;
        object-fit: contain;
        opacity: 0.9;
    }

    .category-item {
        display: inline-flex;
        align-items: center;
    }

    .category-link {
        color: var(--accent-color) !important;
        font-size: 0.9rem !important;
        font-weight: 500 !important;
        text-decoration: none;
        padding: 2px 8px;
        background-color: rgba(128, 128, 128, 0.12);
        border-radius: 12px;
        transition: all 0.2s ease;
    }

    .category-link:hover {
        background-color: var(--accent-color);
        color: #ffffff !important;
    }

    .category-separator {
        color: var(--text-muted);
        margin: 0 2px;
    }

    .post-tags {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .tag-item {
        background-color: var(--loading-bg);
        color: var(--text-muted);
        padding: 4px 12px;
        border-radius: 16px;
        font-size: 0.8rem;
        text-decoration: none;
        transition: all 0.2s ease;
    }

    .tag-item:hover {
        background-color: var(--accent-color);
        color: #000000;
    }

    /* ===== 加载/错误状态 ===== */
    .loading-state, .error-state {
        text-align: center;
        padding: 60px 20px;
        background-color: var(--loading-bg);
        border-radius: 16px;
        color: var(--text-muted);
        font-weight: 300;
        transition: background-color 0.4s ease, color 0.4s ease;
    }

    .error-state {
        color: var(--error-color);
    }

    /* ===== Twikoo 评论容器 ===== */
    .twikoo-wrapper {
        margin-top: 40px;
        width: 100%;
        min-height: 200px;
        border-top: 1px solid var(--border-color);
        padding-top: 30px;
        transition: border-color 0.4s ease;
    }

    .twikoo-wrapper .tk-input .tk-field {
        border: none !important;
        border-bottom: 1px solid var(--border-color) !important;
        border-radius: 0 !important;
        padding: 6px 4px !important;
        background: transparent !important;
        transition: border-color 0.3s ease !important;
        font-size: 0.95rem !important;
        color: var(--text-primary) !important;
    }

    .twikoo-wrapper .tk-input .tk-field:focus {
        border-bottom-color: var(--accent-color) !important;
        box-shadow: none !important;
        outline: none !important;
    }

    .twikoo-wrapper .tk-input .tk-field::placeholder {
        color: var(--text-muted) !important;
        opacity: 0.5 !important;
    }

    .twikoo-wrapper .tk-input .tk-label {
        font-size: 0.75rem !important;
        color: var(--text-muted) !important;
        font-weight: 400 !important;
        margin-bottom: 1px !important;
        opacity: 0.7 !important;
    }

    .twikoo-wrapper .tk-input .tk-submit {
        background-color: transparent !important;
        color: var(--accent-color) !important;
        border: 1px solid var(--accent-color) !important;
        border-radius: 4px !important;
        padding: 2px 16px !important;
        font-size: 0.85rem !important;
        transition: all 0.3s ease !important;
        cursor: pointer !important;
    }

    .twikoo-wrapper .tk-input .tk-submit:hover {
        background-color: var(--accent-color) !important;
        color: #ffffff !important;
    }

    .twikoo-wrapper .tk-input .tk-preview {
        color: var(--text-muted) !important;
        border: none !important;
        background: transparent !important;
        font-size: 0.85rem !important;
        cursor: pointer !important;
    }

    .twikoo-wrapper .tk-input .tk-preview:hover {
        color: var(--accent-color) !important;
    }

    .twikoo-wrapper .tk-comment {
        border-bottom: 1px solid var(--border-color) !important;
        padding: 12px 0 !important;
    }

    .twikoo-wrapper .tk-comment .tk-nick {
        color: var(--text-primary) !important;
        font-weight: 600 !important;
    }

    .twikoo-wrapper .tk-comment .tk-time {
        color: var(--text-muted) !important;
        font-size: 0.75rem !important;
    }

    .twikoo-wrapper .tk-comment .tk-content {
        color: var(--text-primary) !important;
        font-size: 0.95rem !important;
        line-height: 1.6 !important;
    }

    .twikoo-wrapper .tk-footer {
        opacity: 0.25 !important;
        font-size: 0.65rem !important;
        text-align: center !important;
        margin-top: 8px !important;
        color: var(--text-muted) !important;
        transition: opacity 0.3s ease !important;
    }

    .twikoo-wrapper .tk-footer:hover {
        opacity: 0.5 !important;
    }

    /* 隐藏评论标题行和排序标签 */
    .twikoo-wrapper .tk-comment-header,
    .twikoo-wrapper .tk-comments-title,
    .twikoo-wrapper .tk-sort {
        display: none !important;
    }

    /* 隐藏系统信息和IP地址 */
    .twikoo-wrapper .tk-comment .tk-extra {
        display: none !important;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
        .page-wrapper {
            padding: 20px 16px;
        }
        .main-card {
            padding: 28px 24px;
        }
        .nav-menu {
            gap: 12px;
        }
        #theme-toggle {
            width: 28px;
            height: 28px;
            font-size: 0.95rem;
        }
        .article-title-header {
            font-size: 1.0rem;
        }
        .article-title-header .title-icon {
            width: 24px;
            height: 24px;
        }
        .post-content {
            font-size: 1rem;
            line-height: 2.2;
        }
        .article-footer {
            flex-direction: column;
            align-items: flex-start;
        }
        .twikoo-wrapper .tk-input .tk-field {
            font-size: 0.9rem !important;
            padding: 4px 2px !important;
        }
    }
    </style>
</head>
<body>

            <div class="top-section">

                    <div class="article-title-header" id="articleTitle">

    <script>
    // ===== 阅读进度条 =====
    window.addEventListener('scroll', function() {
        const winScroll = document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = (winScroll / height) * 100;
        document.getElementById('progressBar').style.width = scrolled + '%';
    });

    // ===== 清理 Twikoo UI 中不需要的元素 =====
    function cleanTwikooUI() {
        const wrapper = document.getElementById('twikoo-wrapper');
        if (!wrapper) return;

        const header = wrapper.querySelector('.tk-comment-header');
        if (header) header.remove();

        const title = wrapper.querySelector('.tk-comments-title');
        if (title) title.remove();

        const sort = wrapper.querySelector('.tk-sort');
        if (sort) sort.remove();

        const extras = wrapper.querySelectorAll('.tk-comment .tk-extra');
        extras.forEach(el => el.style.display = 'none');
    }

    // ===== 加载 Twikoo 评论 =====
    function loadTwikoo() {
        const wrapper = document.getElementById('twikoo-wrapper');
        wrapper.innerHTML = '<div class="loading-state">💬 加载评论中...</div>';

        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/twikoo@1.7.13/dist/twikoo.all.min.js';
        script.async = true;

        script.onload = function() {
            if (typeof twikoo !== 'undefined') {
                twikoo.init({
                    envId: 'https://sylvie-2026.netlify.app/.netlify/functions/twikoo',
                    el: '#twikoo-wrapper',
                    lang: 'zh-CN',
                    path: window.location.pathname,
                }).then(function() {
                    setTimeout(cleanTwikooUI, 300);
                }).catch(function(err) {
                    console.error('Twikoo 初始化失败:', err);
                    wrapper.innerHTML = '<div class="error-state">⚠️ 评论加载失败，请稍后刷新重试</div>';
                });
            }
        };

        script.onerror = function() {
            wrapper.innerHTML = '<div class="error-state">⚠️ 评论加载失败，请检查网络连接</div>';
        };

        wrapper.appendChild(script);
    }

    // ===== 主题切换功能 =====
    (function() {
        const toggleBtn = document.getElementById('theme-toggle');
        const iconSpan = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        function applyTheme(theme) {
            if (theme === 'dark') {
                htmlElement.classList.add('dark');
                iconSpan.textContent = '☀️';
            } else {
                htmlElement.classList.remove('dark');
                iconSpan.textContent = '🌙';
            }
            localStorage.setItem('theme', theme);
        }

        function getCurrentTheme() {
            return htmlElement.classList.contains('dark') ? 'dark' : 'light';
        }

        function toggleTheme() {
            const current = getCurrentTheme();
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
        }

        function initTheme() {
            const stored = localStorage.getItem('theme');
            if (stored === 'dark' || stored === 'light') {
                applyTheme(stored);
                return;
            }
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(prefersDark ? 'dark' : 'light');
        }

        if (toggleBtn) {
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                toggleTheme();
            });
        }

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (!localStorage.getItem('theme')) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });

        initTheme();
    })();

    // ===== 文章加载逻辑 =====
    (function() {
        const container = document.getElementById('post-container');
        const titleElement = document.getElementById('articleTitle');

        const urlParams = new URLSearchParams(window.location.search);
        const postPath = urlParams.get('path');

        if (!postPath) {
            container.innerHTML = `<div class="error-state">⚠️ 未指定文章路径<br><span style="font-size:0.9rem;">请使用 ?path=/文章/路径/ 访问</span></div>`;
            const titleText = titleElement.querySelector('.title-text');
            if (titleText) titleText.textContent = '未指定文章路径';
            return;
        }

        fetch('/content.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                let posts = Array.isArray(data) ? data : (data.posts || []);
                const urlPath = new URLSearchParams(window.location.search).get('path');

                let post = null;
                post = posts.find(p => p.path === urlPath || '/' + p.path === urlPath);
                if (!post) {
                    const urlFileName = urlPath.split('/').filter(Boolean).pop()?.replace(/\.html$/, '');
                    post = posts.find(p => {
                        const pFileName = p.path.split('/').filter(Boolean).pop()?.replace(/\.html$/, '');
                        return pFileName === urlFileName;
                    });
                }

                if (!post) {
                    container.innerHTML = `<div class="error-state"><h3>❌ 未找到文章</h3><p>路径: ${urlPath}</p></div>`;
                    const titleText = titleElement.querySelector('.title-text');
                    if (titleText) titleText.textContent = '未找到文章';
                    return;
                }

                document.title = `${post.title} · SYLVIE`;
                const titleText = titleElement.querySelector('.title-text');
                if (titleText) titleText.textContent = post.title;

                // 获取标签
                let tags = [];
                if (post.tags) {
                    tags = post.tags.map(t => t.name || t);
                }

                // 获取内容
                let content = post.content || '<p>暂无文章内容</p>';

                // 生成标签HTML
                let tagsHtml = '';
                if (tags.length > 0) {
                    tagsHtml = tags.map(tag => `<span class="tag-item">#${tag}</span>`).join('');
                }

                // 生成分类HTML
                let categoryHtml = '';
                if (post.categories && post.categories.length > 0) {
                    const categoryLinks = post.categories.map((cat, index) => {
                        let catName = '';
                        if (typeof cat === 'string') {
                            catName = cat;
                        } else if (cat && typeof cat === 'object') {
                            catName = cat.name || cat.slug || '';
                        }
                        if (!catName) return '';
                        const encodedCategory = encodeURIComponent(catName);
                        return `
                            <span class="category-item">
                                <a href="/categories/?cat=${encodedCategory}" class="category-link">${catName}</a>
                                ${index < post.categories.length - 1 ? '<span class="category-separator">·</span>' : ''}
                            </span>
                        `;
                    }).join('');
                    if (categoryLinks) {
                        categoryHtml = `
                            <div class="category-container">
                                <span class="category-icon-wrapper">
                                    <img src="/images/label.png" alt="分类" class="category-icon">
                                </span>
                                ${categoryLinks}
                            </div>
                        `;
                    }
                }

                // 渲染文章内容
                container.innerHTML = `
                    <article>
                        <div class="post-content">${content}</div>
                        <footer class="article-footer">
                            ${categoryHtml}
                            <div class="post-tags">${tagsHtml}</div>
                        </footer>
                    </article>
                `;

                // 文章内容加载完成后，加载 Twikoo 评论
                loadTwikoo();
            })
            .catch(error => {
                console.error('加载失败:', error);
                container.innerHTML = `<div class="error-state"><h3>⚠️ 加载失败</h3><p>${error.message}</p></div>`;
                const titleText = titleElement.querySelector('.title-text');
                if (titleText) titleText.textContent = '加载失败';
            });
    })();
    </script>
</body>
