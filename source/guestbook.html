layout: false
title: 留言板
---

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言 · SYLVIE's Blog</title>
    
    <!-- 引入 Lottie 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    
    <style>
        /* ========== CSS变量 - 与分类页/文章详情页完全一致 ========== */
        :root {
            --bg-body: #3171dc;
            --bg-wrapper: #7db9de;
            --bg-card: #ffffff;
            --text-primary: #7db9de;
            --text-secondary: #7db9de;
            --text-muted: #7db9de;
            --text-nav: #7db9de;
            --border-color: #f2f4f8;
            --accent-color: #808080;
            --accent-hover: #b8864a;
            --card-shadow: 0 2px 12px rgba(44, 62, 80, 0.06);
            --loading-bg: rgba(44, 62, 80, 0.04);
            --error-color: #c0392b;
            --post-title: #2c3e50;
            --post-title-hover: #1a2a3a;
            --post-date: #7a8a9e;
            --progress-bg: #f2f4f8;
            --stat-text: #7a8a9e;
            --site-title: #2c3e50;
            --theme-border-color: rgba(44, 62, 80, 0.3);
            --theme-hover-bg: rgba(128, 128, 128, 0.12);
            --lottie-bg: transparent;
        }

        html.dark {
            --bg-body: #1e2024;
            --bg-wrapper: #1e2024;
            --bg-card: #25282e;
            --text-primary: #d4d8e0;
            --text-secondary: #c0c6d0;
            --text-muted: #a8b0be;
            --text-nav: #d4d8e0;
            --border-color: #3a3e45;
            --accent-color: #d19a66;
            --accent-hover: #e0aa77;
            --card-shadow: none;
            --loading-bg: rgba(255, 255, 255, 0.04);
            --error-color: #ff6b6b;
            --post-title: #d4d8e0;
            --post-title-hover: #ffffff;
            --post-date: #a8b0be;
            --progress-bg: #3a3e45;
            --stat-text: #a8b0be;
            --site-title: #d4d8e0;
            --theme-border-color: rgba(255, 255, 255, 0.25);
            --theme-hover-bg: rgba(209, 154, 102, 0.15);
            --lottie-bg: transparent;
        }

        /* ========== 全局样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            font-family: "Helvetica Neue", "Helvetica", "Arial", "Hei", "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.7;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        
        .page-wrapper {
            background-color: var(--bg-wrapper);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background-color 0.4s ease;
        }

        .main-card {
            width: 100%;
            max-width: 780px;
            background-color: var(--bg-card);
            padding: 22px 48px;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .top-section {
            margin-bottom: 8px;
            position: relative;
        }

        /* ===== 顶部行 ===== */
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 6px;
            margin-bottom: 8px;
            width: 100%;
            gap: 12px;
        }

        .site-title {
            font-size: 1.0rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            color: var(--site-title);
            text-align: left;
            opacity: 0.95;
            display: flex;
            align-items: center;
            transition: color 0.4s ease;
        }

        .site-title .lottie-container {
            width: 28px;
            height: 28px;
            margin-right: 6px;
            display: block;
            background-color: var(--lottie-bg);
            transition: background-color 0.4s ease;
        }

        /* ===== 主题切换按钮 ===== */
        #theme-toggle {
            cursor: pointer;
            user-select: none;
            font-size: 1.0rem;
            border: 1.5px dashed var(--theme-border-color);
            background: none;
            padding: 0;
            border-radius: 4px;
            transition: all 0.3s ease;
            color: var(--text-nav);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 27px;
            height: 27px;
            flex-shrink: 0;
            line-height: 1;
        }

        #theme-toggle:hover {
            background-color: var(--theme-hover-bg);
            border-color: var(--accent-color);
            transform: scale(1.05);
            color: var(--accent-color);
        }

        #theme-toggle:active {
            transform: scale(0.92);
        }

        #theme-icon {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        #theme-toggle:hover #theme-icon {
            transform: rotate(20deg);
        }

        .progress-container {
            width: 100%;
            height: 1.5px;
            background-color: var(--progress-bg);
            margin-bottom: 12px;
            transition: background-color 0.4s ease;
        }

        .progress-bar {
            height: 1.5px;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.1s ease;
        }

        /* ===== 导航菜单 ===== */
        .nav-menu {
            display: flex;
            gap: 15px;
            margin: 0;
            padding: 0;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 2px 0;
            text-decoration: none;
            color: var(--text-nav);
            font-size: 0.97rem;
            font-weight: 650;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            border-bottom: 1px solid transparent;
        }

        .nav-link:hover {
            color: var(--accent-color);
        }

        .nav-link.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        /* ===== Twikoo 容器 ===== */
        .twikoo-wrapper {
            margin-top: 0px;
            width: 100%;
            min-height: 400px;
        }

        /* ===== 精简样式 ===== */
        .twikoo-wrapper .tk-input .tk-field {
            border: none !important;
            border-bottom: 1px solid var(--border-color) !important;
            border-radius: 0 !important;
            padding: 6px 4px !important;
            background: transparent !important;
            transition: border-color 0.3s ease !important;
            font-size: 0.95rem !important;
            color: var(--text-primary) !important;
        }

        .twikoo-wrapper .tk-input .tk-field:focus {
            border-bottom-color: var(--accent-color) !important;
            box-shadow: none !important;
            outline: none !important;
        }

        .twikoo-wrapper .tk-input .tk-field::placeholder {
            color: var(--text-muted) !important;
            opacity: 0.5 !important;
        }

        .twikoo-wrapper .tk-input .tk-label {
            font-size: 0.75rem !important;
            color: var(--text-muted) !important;
            font-weight: 400 !important;
            margin-bottom: 1px !important;
            opacity: 0.7 !important;
        }

        .twikoo-wrapper .tk-input .tk-submit {
            background-color: transparent !important;
            color: var(--accent-color) !important;
            border: 1px solid var(--accent-color) !important;
            border-radius: 4px !important;
            padding: 2px 16px !important;
            font-size: 0.85rem !important;
            transition: all 0.3s ease !important;
            cursor: pointer !important;
        }

        .twikoo-wrapper .tk-input .tk-submit:hover {
            background-color: var(--accent-color) !important;
            color: #ffffff !important;
        }

        .twikoo-wrapper .tk-input .tk-preview {
            color: var(--text-muted) !important;
            border: none !important;
            background: transparent !important;
            font-size: 0.85rem !important;
            cursor: pointer !important;
        }

        .twikoo-wrapper .tk-input .tk-preview:hover {
            color: var(--accent-color) !important;
        }

        .twikoo-wrapper .tk-comment {
            border-bottom: 1px solid var(--border-color) !important;
            padding: 12px 0 !important;
        }

        .twikoo-wrapper .tk-comment .tk-nick {
            color: var(--text-primary) !important;
            font-weight: 600 !important;
        }

        .twikoo-wrapper .tk-comment .tk-time {
            color: var(--text-muted) !important;
            font-size: 0.75rem !important;
        }

        .twikoo-wrapper .tk-comment .tk-content {
            color: var(--text-primary) !important;
            font-size: 0.95rem !important;
            line-height: 1.6 !important;
        }

        .twikoo-wrapper .tk-footer {
            opacity: 0.25 !important;
            font-size: 0.65rem !important;
            text-align: center !important;
            margin-top: 8px !important;
            color: var(--text-muted) !important;
            transition: opacity 0.3s ease !important;
        }

        .twikoo-wrapper .tk-footer:hover {
            opacity: 0.5 !important;
        }

        .loading-indicator {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: color 0.4s ease;
        }

        @media (max-width: 768px) {
            .page-wrapper {
                padding: 20px 16px;
            }
            .main-card {
                padding: 28px 24px;
            }
            .nav-menu {
                gap: 12px;
            }
            #theme-toggle {
                width: 28px;
                height: 28px;
                font-size: 0.95rem;
            }
            .twikoo-wrapper .tk-input .tk-field {
                font-size: 0.9rem !important;
                padding: 4px 2px !important;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="main-card">
            <div class="top-section">
                <div class="top-row">
                    <div class="site-title">
                        <div id="lottie-animation" class="lottie-container"></div>
                        SYLVIE's Blog
                    </div>
                    <button id="theme-toggle" aria-label="切换主题">
                        <span id="theme-icon">🌙</span>
                    </button>
                </div>
                
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div class="nav-menu">
                    <a href="/" class="nav-link">首页</a>
                    <a href="/blog-custom.html" class="nav-link">日志</a>
                    <a href="/categories/" class="nav-link">分类</a>
                    <a href="/guestbook.html" class="nav-link active">留言</a>
                </div>
            </div>

            <div class="twikoo-wrapper" id="twikoo-wrapper">
                <div id="loading-message" class="loading-indicator">加载留言板中...</div>
            </div>
        </div>
    </div>

    <script>
        // ===== 阅读进度条 =====
        window.addEventListener('scroll', function() {
            const winScroll = document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('progressBar').style.width = scrolled + '%';
        });

        // ===== Lottie 动画 =====
        function loadLottieAnimation() {
            const animationContainer = document.getElementById('lottie-animation');
            if (typeof lottie === 'undefined') {
                console.error('Lottie 库加载失败');
                animationContainer.style.backgroundColor = '#d19a66';
                animationContainer.style.borderRadius = '4px';
                return;
            }
            fetch('/images/message.json')
                .then(response => {
                    if (!response.ok) throw new Error('JSON 文件不存在');
                    return response.json();
                })
                .then(animationData => {
                    animationContainer.innerHTML = '';
                    lottie.loadAnimation({
                        container: animationContainer,
                        renderer: 'svg',
                        loop: true,
                        autoplay: true,
                        animationData: animationData
                    });
                    console.log('Lottie 动画加载成功');
                })
                .catch(error => {
                    console.error('动画加载失败:', error);
                    animationContainer.style.backgroundColor = '#d19a66';
                    animationContainer.style.borderRadius = '4px';
                });
        }

        // ===== 清理评论中不需要的元素 =====
        function cleanTwikooUI() {
            // 每隔 500ms 检查一次，持续 5 秒，确保 DOM 已渲染
            let attempts = 0;
            const maxAttempts = 10;
            const interval = setInterval(() => {
                attempts++;
                const wrapper = document.getElementById('twikoo-wrapper');
                if (!wrapper) return;

                // 1. 删除评论标题行（包含"X条评论"和排序标签）
                const header = wrapper.querySelector('.tk-comment-header');
                if (header) header.remove();

                // 2. 删除评论数标题
                const title = wrapper.querySelector('.tk-comments-title');
                if (title) title.remove();

                // 3. 删除排序标签
                const sort = wrapper.querySelector('.tk-sort');
                if (sort) sort.remove();

                // 4. 隐藏系统信息和IP地址
                const extras = wrapper.querySelectorAll('.tk-comment .tk-extra');
                extras.forEach(el => el.style.display = 'none');

                // 如果都删完了，停止检查
                if (!header && !title && !sort && extras.length > 0) {
                    clearInterval(interval);
                    console.log('Twikoo UI 精简完成');
                }
                if (attempts >= maxAttempts) {
                    clearInterval(interval);
                    console.log('Twikoo UI 精简检查结束');
                }
            }, 500);
        }

        // ===== Twikoo 评论加载 =====
        function loadTwikoo() {
            const wrapper = document.getElementById('twikoo-wrapper');
            wrapper.innerHTML = '<div id="loading-message" class="loading-indicator">加载留言板中...</div>';
            
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/twikoo@1.7.13/dist/twikoo.all.min.js';
            script.async = true;
            
            script.onload = function() {
                console.log('Twikoo 库加载成功');
                if (typeof twikoo !== 'undefined') {
                    twikoo.init({
                        envId: 'https://sylvie-2026.netlify.app/.netlify/functions/twikoo',
                        el: '#twikoo-wrapper',
                        lang: 'zh-CN',
                        path: window.location.pathname,
                    }).then(function() {
                        console.log('Twikoo 初始化成功');
                        const loadingMsg = document.getElementById('loading-message');
                        if (loadingMsg) loadingMsg.style.display = 'none';
                        // 初始化完成后，开始清理 UI
                        setTimeout(cleanTwikooUI, 300);
                    }).catch(function(err) {
                        console.error('Twikoo 初始化失败:', err);
                        const loadingMsg = document.getElementById('loading-message');
                        if (loadingMsg) loadingMsg.textContent = '⚠️ 留言板加载失败，请稍后刷新重试';
                    });
                }
            };
            
            script.onerror = function() {
                console.error('Twikoo 库加载失败');
                const loadingMsg = document.getElementById('loading-message');
                if (loadingMsg) loadingMsg.textContent = '⚠️ 留言板加载失败，请检查网络连接';
            };
            
            wrapper.appendChild(script);
        }

        // ===== 主题切换 =====
        (function() {
            const toggleBtn = document.getElementById('theme-toggle');
            const iconSpan = document.getElementById('theme-icon');
            const htmlElement = document.documentElement;

            function applyTheme(theme) {
                if (theme === 'dark') {
                    htmlElement.classList.add('dark');
                    iconSpan.textContent = '☀️';
                } else {
                    htmlElement.classList.remove('dark');
                    iconSpan.textContent = '🌙';
                }
                localStorage.setItem('theme', theme);
            }

            function getCurrentTheme() {
                return htmlElement.classList.contains('dark') ? 'dark' : 'light';
            }

            function toggleTheme() {
                const current = getCurrentTheme();
                const next = current === 'dark' ? 'light' : 'dark';
                applyTheme(next);
            }

            function initTheme() {
                const stored = localStorage.getItem('theme');
                if (stored === 'dark' || stored === 'light') {
                    applyTheme(stored);
                    return;
                }
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(prefersDark ? 'dark' : 'light');
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    toggleTheme();
                });
            }

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });

            initTheme();
        })();

        // ===== 页面初始化 =====
        document.addEventListener('DOMContentLoaded', function() {
            loadLottieAnimation();
            loadTwikoo();
        });
    </script>
</body>
</html>
