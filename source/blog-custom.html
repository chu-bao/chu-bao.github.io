<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志 · SYLVIE's Blog</title>
    <style>
        /* 全局样式 - 深色背景 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            font-family: "Helvetica Neue", "Helvetica", "Arial", "Hei", "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: #282c34;
            color: #ffffff;
            line-height: 1.6;
        }
        
        /* 外层容器 - 深色背景 */
        .page-wrapper {
            background-color: #282c34;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* ===== 深色主卡片容器 ===== */
        .main-card {
            width: 100%;
            max-width: 780px;
            background-color: #23272e;
            padding: 22px 48px;
            margin: 0 auto;
        }

        /* ===== 顶部区域 ===== */
        .top-section {
            margin-bottom: 32px;
            position: relative;
        }

        /* 站点名称 */
        .site-title {
            font-size: 1.0rem;
            font-weight: 150;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-bottom: 8px;
            text-align: left;
            opacity: 0.95;
            display: flex;
            align-items: center;
        }

        /* 站点名称前面的小图片 */
        .site-logo-img {
            width: 35px;
            height: 35px;
            margin-right: 6px;
            object-fit: cover;
        }

        /* 进度条容器 */
        .progress-container {
            width: 100%;
            height: 3px;
            background-color: #403e3e;
            margin-bottom: 16px;
        }

        /* 进度条 - 动态宽度 */
        .progress-bar {
            height: 3px;
            background-color: #d19a66;
            width: 0%;
            transition: width 0.1s ease;
        }

        /* 导航菜单 */
        .nav-menu {
            display: flex;
            gap: 24px;
            margin: 0;
            padding: 0;
        }

        .nav-link {
            padding: 4px 0;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            font-weight: 650;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            border-bottom: 1px solid transparent;
        }

        .nav-link:hover {
            color: #d19a66;
        }

        .nav-link.active {
            color: #d19a66;
            border-bottom-color: #d19a66;
        }

        /* ===== 文章列表 ===== */
        .posts-list {
            list-style: none;
            margin-top: 24px;
        }

        /* 文章项 - 使用flex布局 */
        .post-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            gap: 16px;
        }

        .post-item:last-child {
            border-bottom: none;
        }

        /* 左侧小图片容器 */
        .post-image {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            overflow: hidden;
            background-color: #f5f5f5;
            flex-shrink: 0;
        }

        .post-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 右侧内容容器 - 采用上下布局 */
        .post-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            justify-content: center;
            padding: 2px 0;
        }

        /* 标题行 - 标题单独一行，去掉右侧空间 */
        .post-title-row {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 4px;
        }

        /* 标题 */
        .post-title {
            font-size: 0.8rem;
            font-weight: 550;
            color: #d19a66;
            text-decoration: none;
            transition: color 0.2s ease;
            word-break: break-word;
        }

        .post-title:hover {
            color: #ffffff;
        }

        /* 底部信息行 - 只放日期 */
        .post-footer {
            display: flex;
            align-items: center;
            width: 100%;
        }

        /* 日期 */
        .post-date {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }

        /* 加载状态 */
        .loading-state, .error-state, .empty-state {
            text-align: center;
            padding: 40px 20px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 24px;
            font-weight: 300;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 错误状态特殊颜色 */
        .error-state {
            color: #ff6b6b;
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .page-wrapper {
                padding: 20px 16px;
            }
            .main-card {
                padding: 28px 24px;
            }
            .nav-menu {
                gap: 16px;
                flex-wrap: wrap;
            }
            .post-item {
                gap: 12px;
            }
            .post-image {
                width: 48px;
                height: 48px;
            }
            .post-title {
                font-size: 0.95rem;
            }
        }
    </style>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
    <!-- 深色背景容器 -->
    <div class="page-wrapper">
        <div class="main-card">
            <!-- 顶部区域保持不变 -->
            <div class="top-section">
                <div class="site-title">
                    <img src="/images/头像1.png" alt="logo" class="site-logo-img">
                    SYLVIE's Blog
                </div>
                
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div class="nav-menu">
                    <a href="/" class="nav-link">首页</a>
                    <a href="/blog-custom.html" class="nav-link active">日志</a>
                    <a href="/categories/" class="nav-link">分类</a>
                    <a href="/guestbook.html" class="nav-link">留言</a>
                </div>
            </div>

            <!-- 文章列表容器 -->
            <main class="posts-list" id="posts-container">
                <div class="loading-state">📚 加载文章中...</div>
            </main>
        </div>
    </div>
<!-- 不蒜子统计 - 全站总访问量 -->
<div style="text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; color: rgba(255,255,255,0.5);">
    📊 本站总访问量：<span id="busuanzi_value_site_pv">0</span> 次
</div>
    <script>
// ===== 阅读进度条功能 =====
window.addEventListener('scroll', function() {
    const winScroll = document.documentElement.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    const scrolled = (winScroll / height) * 100;
    document.getElementById('progressBar').style.width = scrolled + '%';
});

// ===== 相对时间格式化函数 =====
function timeAgo(dateString) {
    try {
        const date = new Date(dateString);
        const now = new Date();
        const seconds = Math.floor((now - date) / 1000);
        const minutes = Math.floor(seconds / 60);
        const hours = Math.floor(minutes / 60);
        const days = Math.floor(hours / 24);
        const months = Math.floor(days / 30);
        const years = Math.floor(days / 365);
        if (years > 0) return years + '年前';
        if (months > 0) return months + '个月前';
        if (days > 0) return days + '天前';
        return '今日';
    } catch(e) {
        return '日期未知';
    }
}

// ===== 文章加载功能 =====
(function() {
    const container = document.getElementById('posts-container');
    container.innerHTML = '<div class="loading-state">📚 加载文章中...</div>';
    
    fetch('/content.json?t=' + Date.now())
        .then(response => {
            if (!response.ok) throw new Error('content.json 不存在');
            return response.json();
        })
        .then(data => {
            console.log('content.json 加载成功，文章数量:', data.length);
            
            let posts = Array.isArray(data) ? data : (data.posts || []);
            
            if (posts.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 暂无文章</div>';
                return;
            }
            
            posts.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            let html = '';
            posts.forEach((post) => {
                const relativeDate = timeAgo(post.date);   
                const postPath = post.path.startsWith('/') ? post.path : '/' + post.path;
                const link = `/post-template.html?path=${encodeURIComponent(postPath)}`;
                const thumbnail = post.thumbnail || '/images/default-post.jpg';
                
                html += `
                    <div class="post-item">
                        <div class="post-image">
                            <img src="${thumbnail}" alt="${post.title}" loading="lazy">
                        </div>
                        <div class="post-content">
                            <div class="post-title-row">
                                <a href="${link}" class="post-title">${post.title || '无标题'}</a>
                            </div>
                            <div class="post-footer">
                                <span class="post-date">${relativeDate}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            console.log('文章列表渲染完成');
        })
        .catch(error => {
            console.error('加载失败:', error);
            container.innerHTML = `
                <div class="error-state">
                    <span style="font-size:1.5rem;">⚠️</span>
                    <h3 style="color:#ff6b6b;">加载失败</h3>
                    <p>${error.message}</p>
                </div>
            `;
        });
})();
</script>
</body>
</html>
