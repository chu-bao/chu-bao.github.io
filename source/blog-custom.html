<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志 · SYLVIE's Blog</title>
    <style>
    
        :root {
            /* 浅色模式*/
            --bg-body: #3171dc;          
            --bg-wrapper: #7db9de;
            --bg-card: #ffffff;           
            --text-primary: #7db9de;      
            --text-secondary: #7db9de;    /* 次文字：蓝灰 */
            --text-muted: #7db9de;        /* 辅助文字：灰 */
            --text-nav: #7db9de;          /* 导航文字：深蓝灰 */
            --border-color: #f2f4f8;      /* 边框：暖灰 */
            --accent-color: #808080;      /* 强调色（保留） */
            --accent-hover: #b8864a;
            --card-shadow: 0 2px 12px rgba(44, 62, 80, 0.06);
            --loading-bg: rgba(44, 62, 80, 0.04);
            --error-color: #c0392b;
            --post-title: #7db9de;
            --post-title-hover: #1a2a3a;
            --post-date: #7a8a9e;
            --progress-bg: #f2f4f8;
            --stat-text: #7a8a9e;
            --site-title: #2c3e50;
        }

        /* ===== 2. 深色模式 ===== */
        html.dark {
            --bg-body: #1e2024;
            --bg-wrapper: #1e2024;
            --bg-card: #25282e;
            --text-primary: #d4d8e0;
            --text-secondary: #c0c6d0;
            --text-muted: #a8b0be;
            --text-nav: #d4d8e0;
            --border-color: #3a3e45;
            --accent-color: #d4d8e0;
            --accent-hover: #e0aa77;
            --card-shadow: none;
            --loading-bg: rgba(255, 255, 255, 0.04);
            --error-color: #ff6b6b;
            --post-title: #d4d8e0;
            --post-title-hover: #ffffff;
            --post-date: #a8b0be;
            --progress-bg: #3a3e45;
            --stat-text: #a8b0be;
            --site-title: #d4d8e0;
        }

        /* ===== 3. 全局样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            font-family: "Helvetica Neue", "Helvetica", "Arial", "Hei", "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.7;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        
        .page-wrapper {
            background-color: var(--bg-wrapper);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background-color 0.4s ease;
        }

        .main-card {
            width: 100%;
            max-width: 780px;
            background-color: var(--bg-card);
            padding: 22px 48px;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .top-section {
            margin-bottom: 8px;
            position: relative;
        }

        /* ===== 新增：顶部行（标题 + 按钮） ===== */
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 6px;   
            margin-bottom: 8px;
            width: 100%;
            
        }

        .site-title {
            font-size: 1.0rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            color: var(--site-title);
            text-align: left;
            opacity: 0.95;
            display: flex;
            align-items: center;
            transition: color 0.4s ease;
        }

        .site-logo-img {
            width: 28px;
            height: 28px;
           color: var(--site-title); 
        }

        .progress-container {
            width: 100%;
            height: 1.5px;
            background-color: var(--progress-bg);
            margin-bottom: 12px;
            transition: background-color 0.4s ease;
        }

        .progress-bar {
            height: 1.5px;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.1s ease;
        }

        /* ===== 4. 导航菜单 ===== */
        .nav-menu {
            display: flex;
            gap: 15px;
            margin: 0;
            padding: 0;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 2px 0;
            text-decoration: none;
            color: var(--text-nav);
           
            font-size: 0.97rem;
            font-weight: 650;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            border-bottom: 1.0px solid transparent;
            /*transform: scaleY(1.05);*/
        }

        .nav-link:hover {
            color: var(--accent-color);
        }

        .nav-link.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
            
        }

        /* ===== 主题切换按钮 - 正方形虚线框，独立于导航栏 ===== */
        #theme-toggle {
            cursor: pointer;
            user-select: none;
            font-size: 1.0rem;
            border: 1.5px dashed rgba(44, 62, 80, 0.3);
            background: none;
            padding: 0;
            border-radius: 4px;
            transition: all 0.3s ease;
            color: var(--text-nav);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 27px;
            height: 27px;
            flex-shrink: 0;
            line-height: 1;
        }

        /* 深色模式下虚线框颜色 */
        html.dark #theme-toggle {
            border-color: rgba(255, 255, 255, 0.25);
        }

        #theme-toggle:hover {
            background-color: rgba(128, 128, 128, 0.12);
            border-color: var(--accent-color);
            transform: scale(1.05);
            color: var(--accent-color);
        }

        #theme-toggle:active {
            transform: scale(0.92);
        }

        #theme-icon {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        #theme-toggle:hover #theme-icon {
            transform: rotate(20deg);
        }

        /* ===== 5. 文章列表 ===== */
        .posts-list {
            list-style: none;
            margin-top: 0px;
        }
/* 文章项 - 使用flex布局 */
        .post-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            gap: 15px;
        }

        .post-item:last-child {
            border-bottom: none;
        }
        

        .post-image {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--border-color);
            flex-shrink: 0;
            transition: background-color 0.4s ease;
        }

        .post-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .post-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            justify-content: center;
            padding: 2px 0;
        }

        .post-title-row {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 4px;
        }

        .post-title {
            font-size: 0.9rem;
            font-weight: 550;
            color: var(--post-title);
            text-decoration: none;
            transition: color 0.25s ease;
            word-break: break-word;
        }

        .post-title:hover {
            color: var(--post-title-hover);
        }

        .post-footer {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .post-date {
            font-size: 0.8rem;
            color: var(--post-date);
            transition: color 0.4s ease;
        }

        /* ===== 6. 加载/错误/空状态 ===== */
        .loading-state, .error-state, .empty-state {
            text-align: center;
            padding: 40px 20px;
            background-color: var(--loading-bg);
            border-radius: 16px;
            color: var(--text-muted);
            margin-top: 24px;
            font-weight: 300;
            border: 1px solid var(--border-color);
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }

        .error-state {
            color: var(--error-color);
        }

        /* ===== 7. 统计信息 ===== */
        .site-stats {
            text-align: center;
            margin-top: 8px;
            padding-top: 16px;
            font-size: 0.8rem;
            color: var(--stat-text);
            border-top: 1px solid var(--border-color);
            transition: color 0.4s ease, border-color 0.4s ease;
        }

        .site-stats img {
            width: 1.1rem;
            height: 1.1rem;
            vertical-align: middle;
            margin-right: 5px;
        }

        /* ===== 8. 响应式调整 ===== */
        @media (max-width: 768px) {
            .page-wrapper {
                padding: 20px 16px;
            }
            .main-card {
                padding: 28px 24px;
            }
            .nav-menu {
                gap: 16px;
            }
            #theme-toggle {
                width: 28px;
                height: 28px;
                font-size: 0.95rem;
            }
            .post-item {
                gap: 12px;
            }
            .post-image {
                width: 48px;
                height: 48px;
            }
            .post-title {
                font-size: 0.9rem;
            }
        }
    </style>
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</head>
<body>
    <div class="page-wrapper">
        <div class="main-card">
            <div class="top-section">
                <!-- ===== 新增顶部行：左标题 + 右按钮 ===== -->
                <div class="top-row">
                    <div class="site-title">
    <svg class="site-logo-img" viewBox="0 0 1024 1024" fill="currentColor" xmlns="http://www.w3.org/2000/svg">

</div>
                    <button id="theme-toggle" aria-label="切换主题">
                        <span id="theme-icon">🌙</span>
                    </button>
                </div>
                
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <!-- ===== 导航栏中移除按钮 ===== -->
                <div class="nav-menu">
                    <a href="/" class="nav-link">首页</a>
                    <a href="/blog-custom.html" class="nav-link active">日志</a>
                    <a href="/categories/" class="nav-link">分类</a>
                    <a href="/guestbook.html" class="nav-link">留言</a>
                </div>
            </div>

            <main class="posts-list" id="posts-container">
                <div class="loading-state">📚 加载文章中...</div>
            </main>

            <div class="site-stats">
                <img src="/images/统计.png" alt="统计">
                本站总访问量：<span id="busuanzi_value_site_pv">0</span> 次
            </div>
        </div>
    </div>

    <script>
    // ===== 阅读进度条 =====
    window.addEventListener('scroll', function() {
        const winScroll = document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = (winScroll / height) * 100;
        document.getElementById('progressBar').style.width = scrolled + '%';
    });

    // ===== 相对时间格式化 =====
    function timeAgo(dateString) {
        try {
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            const months = Math.floor(days / 30);
            const years = Math.floor(days / 365);
            if (years > 0) return years + '年前';
            if (months > 0) return months + '个月前';
            if (days > 0) return days + '天前';
            return '今日';
        } catch(e) {
            return '日期未知';
        }
    }

    // ===== 文章加载 =====
    (function() {
        const container = document.getElementById('posts-container');
        container.innerHTML = '<div class="loading-state">📚 加载文章中...</div>';
        
        fetch('/content.json?t=' + Date.now())
            .then(response => {
                if (!response.ok) throw new Error('content.json 不存在');
                return response.json();
            })
            .then(data => {
                console.log('content.json 加载成功，文章数量:', data.length);
                
                let posts = Array.isArray(data) ? data : (data.posts || []);
                
                if (posts.length === 0) {
                    container.innerHTML = '<div class="empty-state">📭 暂无文章</div>';
                    return;
                }
                
                posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                let html = '';
                posts.forEach((post) => {
                    const relativeDate = timeAgo(post.date);   
                    const postPath = post.path.startsWith('/') ? post.path : '/' + post.path;
                    const link = `/post-template.html?path=${encodeURIComponent(postPath)}`;
                    const thumbnail = post.thumbnail || '/images/default-post.jpg';
                    
                    html += `
                        <div class="post-item">
                            <div class="post-image">
                                <img src="${thumbnail}" alt="${post.title}" loading="lazy">
                            </div>
                            <div class="post-content">
                                <div class="post-title-row">
                                    <a href="${link}" class="post-title">${post.title || '无标题'}</a>
                                </div>
                                <div class="post-footer">
                                    <span class="post-date">${relativeDate}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                console.log('文章列表渲染完成');
            })
            .catch(error => {
                console.error('加载失败:', error);
                container.innerHTML = `
                    <div class="error-state">
                        <span style="font-size:1.5rem;">⚠️</span>
                        <h3 style="color:var(--error-color);">加载失败</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            });
    })();

    // ===== 主题切换功能 =====
    (function() {
        const toggleBtn = document.getElementById('theme-toggle');
        const iconSpan = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;

        function applyTheme(theme) {
            if (theme === 'dark') {
                htmlElement.classList.add('dark');
                iconSpan.textContent = '☀️';
            } else {
                htmlElement.classList.remove('dark');
                iconSpan.textContent = '🌙';
            }
            localStorage.setItem('theme', theme);
        }

        function getCurrentTheme() {
            return htmlElement.classList.contains('dark') ? 'dark' : 'light';
        }

        function toggleTheme() {
            const current = getCurrentTheme();
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
        }

        function initTheme() {
            const stored = localStorage.getItem('theme');
            if (stored === 'dark' || stored === 'light') {
                applyTheme(stored);
                return;
            }
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(prefersDark ? 'dark' : 'light');
        }

        if (toggleBtn) {
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                toggleTheme();
            });
        }

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            if (!localStorage.getItem('theme')) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });

        initTheme();
    })();
    </script>
</body>
