<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类 · SYLVIE</title>
    
    <style>
        /* ========== CSS变量 - 与文章详情页完全一致 ========== */
        :root {
            /* 浅色模式 - 与post-template保持一致 */
            --bg-body: #3171dc;
            --bg-wrapper: #7db9de;
            --bg-card: #ffffff;
            --text-primary: #7db9de;
            --text-secondary: #7db9de;
            --text-muted: #7db9de;
            --text-nav: #7db9de;
            --border-color: #f2f4f8;
            --accent-color: #808080;
            --accent-hover: #b8864a;
            --card-shadow: 0 2px 12px rgba(44, 62, 80, 0.06);
            --loading-bg: rgba(44, 62, 80, 0.04);
            --error-color: #c0392b;
            --post-title: #2c3e50;
            --post-title-hover: #1a2a3a;
            --post-date: #7a8a9e;
            --progress-bg: #f2f4f8;
            --stat-text: #7a8a9e;
            --site-title: #2c3e50;
            --theme-border-color: rgba(44, 62, 80, 0.3);
            --theme-hover-bg: rgba(128, 128, 128, 0.12);
            --category-card-overlay: rgba(44, 62, 80, 0.15);
            --category-card-text: #ffffff;
            --post-border: rgba(44, 62, 80, 0.08);
        }

        /* 深色模式 - 与post-template保持一致 */
        html.dark {
            --bg-body: #1e2024;
            --bg-wrapper: #1e2024;
            --bg-card: #25282e;
            --text-primary: #d4d8e0;
            --text-secondary: #c0c6d0;
            --text-muted: #a8b0be;
            --text-nav: #d4d8e0;
            --border-color: #3a3e45;
            --accent-color: #d4d8e0;
            --accent-hover: #e0aa77;
            --card-shadow: none;
            --loading-bg: rgba(255, 255, 255, 0.04);
            --error-color: #ff6b6b;
            --post-title: #d4d8e0;
            --post-title-hover: #ffffff;
            --post-date: #a8b0be;
            --progress-bg: #3a3e45;
            --stat-text: #a8b0be;
            --site-title: #d4d8e0;
            --theme-border-color: rgba(255, 255, 255, 0.25);
            --theme-hover-bg: rgba(209, 154, 102, 0.15);
            --category-card-overlay: rgba(0, 0, 0, 0.55);
            --category-card-text: #ffffff;
            --post-border: rgba(255, 255, 255, 0.06);
        }

        /* ========== 全局样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            font-family: "Helvetica Neue", "Helvetica", "Arial", "Hei", "Microsoft YaHei", "PingFang SC", sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.7;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        
        .page-wrapper {
            background-color: var(--bg-wrapper);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: background-color 0.4s ease;
        }

        .main-card {
            width: 100%;
            max-width: 780px;
            background-color: var(--bg-card);
            padding: 22px 48px;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .top-section {
            margin-bottom: 8px;
            position: relative;
        }

        /* ===== 顶部行：站点标题 + 主题按钮 ===== */
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
             padding-top: 6px;
            margin-bottom: 8px;
            width: 100%;
            gap: 12px;
        }

        .site-title {
            font-size: 1.0rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            color: var(--site-title);
            text-align: left;
            opacity: 0.95;
            display: flex;
            align-items: center;
            transition: color 0.4s ease;
        }

        .site-title .title-icon {
            width: 28px;
            height: 28px;
            margin-right: 6px;
            flex-shrink: 0;
            color: var(--site-title);
        }

        /* ===== 主题切换按钮 - 正方形虚线框 ===== */
        #theme-toggle {
            cursor: pointer;
            user-select: none;
            font-size: 1.0rem;
            border: 1.5px dashed var(--theme-border-color);
            background: none;
            padding: 0;
            border-radius: 4px;
            transition: all 0.3s ease;
            color: var(--text-nav);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 27px;
            height: 27px;
            flex-shrink: 0;
            line-height: 1;
        }

        #theme-toggle:hover {
            background-color: var(--theme-hover-bg);
            border-color: var(--accent-color);
            transform: scale(1.05);
            color: var(--accent-color);
        }

        #theme-toggle:active {
            transform: scale(0.92);
        }

        #theme-icon {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        #theme-toggle:hover #theme-icon {
            transform: rotate(20deg);
        }

        .progress-container {
            width: 100%;
            height: 1.5px;
            background-color: var(--progress-bg);
            margin-bottom: 12px;
            transition: background-color 0.4s ease;
        }

        .progress-bar {
            height: 1.5px;
            background-color: var(--accent-color);
            width: 0%;
            transition: width 0.1s ease;
        }

        /* ===== 导航菜单 ===== */
        .nav-menu {
            display: flex;
            gap: 15px;
            margin: 0;
            padding: 0;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 2px 0;
            text-decoration: none;
            color: var(--text-nav);
            font-size: 0.97rem;
            font-weight: 650;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            border-bottom: 1px solid transparent;
        }

        .nav-link:hover {
            color: var(--accent-color);
        }

        .nav-link.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        /* ===== 分类卡片网格 ===== */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 4px;
        }
        
        @media (max-width: 768px) {
            .categories-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }

        .category-card {
            position: relative;
            border: none;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.25s ease;
            background-size: cover;
            background-position: center;
            height: 180px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(209, 154, 102, 0.25);
        }

        /* 每个分类不同的背景图片 */
        .category-card[data-category="学习"] {
            background-image: url('/images/life-bg.jpeg');
        }
        .category-card[data-category="技术"] {
            background-image: url('/images/tech-bg.jpg');
        }
        .category-card[data-category="旅行"] {
            background-image: url('/images/travel.jpeg');
        }
        .category-card[data-category="生活"] {
            background-image: url('/images/life.jpeg');
        }
        .category-card[data-category="摄影"] {
            background-image: url('/images/photo-bg.jpg');
        }
        .category-card[data-category="测试"] {
            background-image: url('/images/study-bg.jpeg');
        }
        .category-card[data-category="读书"] {
            background-image: url('/images/读书.jpg');
        }

        .category-card .card-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 18px;
            background: linear-gradient(to top, var(--category-card-overlay) 0%, transparent 100%);
            transition: background 0.3s ease;
        }

        .category-card:hover .card-content {
            background: linear-gradient(to top, rgba(209, 154, 102, 0.3) 0%, transparent 100%);
        }

        .category-card .card-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--category-card-text);
            display: block;
            margin-bottom: 2px;
            letter-spacing: 0.3px;
        }

        .category-card .card-count {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .category-card .card-preview {
            font-size: 0.85rem;
            color: #ffffff;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 4px;
            opacity: 0.9;
        }

        /* ===== 文章列表 ===== */
        .posts-list {
            list-style: none;
            margin-top: 8px;
        }

        .post-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            gap: 16px;
            border-bottom: 1px solid var(--post-border);
            transition: border-color 0.3s ease;
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-image {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--border-color);
            flex-shrink: 0;
            transition: background-color 0.3s ease;
        }

        .post-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .post-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            justify-content: center;
            padding: 2px 0;
        }

        .post-title {
            font-size: 0.8rem;
            font-weight: 550;
            color: var(--post-title);
            text-decoration: none;
            transition: color 0.25s ease;
            word-break: break-word;
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .post-title:hover {
            color: var(--post-title-hover);
        }

        .post-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .post-date {
            font-size: 0.8rem;
            color: var(--post-date);
            transition: color 0.3s ease;
        }

        .post-meta .busuanzi_value_page_pv {
            color: #000000;
            background-color: var(--accent-color);
            padding: 0px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 500;
            line-height: 1.4;
            display: inline-block;
        }

        /* ===== 返回分类列表链接 ===== */
        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--accent-hover);
        }

        /* ===== 加载/错误/空状态 ===== */
        .loading-state, .error-state, .empty-state {
            text-align: center;
            padding: 40px 20px;
            background-color: var(--loading-bg);
            border-radius: 16px;
            color: var(--text-muted);
            margin-top: 12px;
            font-weight: 300;
            border: 1px solid var(--border-color);
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
            grid-column: 1 / -1;
        }

        .error-state {
            color: var(--error-color);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .page-wrapper {
                padding: 20px 16px;
            }
            .main-card {
                padding: 28px 24px;
            }
            .nav-menu {
                gap: 12px;
            }
            #theme-toggle {
                width: 28px;
                height: 28px;
                font-size: 0.95rem;
            }
            .category-card {
                height: 150px;
            }
            .post-item {
                gap: 12px;
            }
            .post-image {
                width: 48px;
                height: 48px;
            }
            .post-title {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

    <script>
        // ===== 阅读进度条 =====
        window.addEventListener('scroll', function() {
            const winScroll = document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('progressBar').style.width = scrolled + '%';
        });

        // ===== 获取URL参数 =====
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // ===== 加载分类卡片 =====
        function loadCategories() {
            const container = document.getElementById('dynamic-content');
            
            fetch('/content.json?t=' + Date.now())
                .then(res => {
                    if (!res.ok) throw new Error('content.json 不存在');
                    return res.json();
                })
                .then(data => {
                    let posts = Array.isArray(data) ? data : (data.posts || []);
                    
                    if (posts.length === 0) {
                        container.innerHTML = '<div class="error-state">暂无文章</div>';
                        return;
                    }
                    
                    const categoriesMap = new Map();
                    posts.forEach(post => {
                        if (post.categories && post.categories.length > 0) {
                            post.categories.forEach(cat => {
                                let catName = typeof cat === 'string' ? cat : (cat.name || cat.slug || '');
                                if (!catName) return;
                                if (!categoriesMap.has(catName)) {
                                    categoriesMap.set(catName, []);
                                }
                                categoriesMap.get(catName).push(post);
                            });
                        }
                    });
                    
                    if (categoriesMap.size === 0) {
                        container.innerHTML = '<div class="error-state">暂无分类</div>';
                        return;
                    }
                    
                    const categoryOrder = ['生活', '技术', '骑行', '摄影', '测试', '学习', '读书'];
                    const sortedCategories = Array.from(categoriesMap.entries())
                        .sort((a, b) => {
                            const ia = categoryOrder.indexOf(a[0]), ib = categoryOrder.indexOf(b[0]);
                            if (ia !== -1 && ib !== -1) return ia - ib;
                            if (ia !== -1) return -1;
                            if (ib !== -1) return 1;
                            return a[0].localeCompare(b[0]);
                        });
                    
                    let html = '<div class="categories-grid">';
                    sortedCategories.forEach(([catName, catPosts]) => {
                        const firstPost = catPosts[0];
                        const firstPostTitle = firstPost.title || '无标题';
                        html += `
                            <div class="category-card" data-category="${catName}" onclick="window.location.href='/categories/?cat=${encodeURIComponent(catName)}'">
                                <div class="card-content">
                                    <span class="card-name">${catName}</span>
                                    <span class="card-count">${catPosts.length} 篇</span>
                                    <div class="card-preview">${firstPostTitle}</div>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    container.innerHTML = html;
                })
                .catch(error => {
                    console.error('加载失败:', error);
                    container.innerHTML = `<div class="error-state"><h3>⚠️ 加载失败</h3><p>${error.message}</p></div>`;
                });
        }

        // ===== 加载分类详情（文章列表） =====
        function loadCategoryDetail(categoryName) {
            const container = document.getElementById('dynamic-content');
            
            fetch('/content.json?t=' + Date.now())
                .then(res => {
                    if (!res.ok) throw new Error('content.json 不存在');
                    return res.json();
                })
                .then(data => {
                    let posts = Array.isArray(data) ? data : (data.posts || []);
                    
                    const categoryPosts = posts.filter(post => {
                        if (!post.categories) return false;
                        return post.categories.some(cat => {
                            const catName = typeof cat === 'string' ? cat : (cat.name || cat.slug || '');
                            return catName === categoryName;
                        });
                    });
                    
                    if (categoryPosts.length === 0) {
                        container.innerHTML = `
                            <div>
                                <a href="/categories/" class="back-link">← 返回分类列表</a>
                                <div class="error-state"><h3>❌ 分类 "${categoryName}" 下暂无文章</h3></div>
                            </div>
                        `;
                        return;
                    }
                    
                    categoryPosts.sort((a, b) => new Date(b.date) - new Date(a.date));
                    
                    let postsHtml = '';
                    categoryPosts.forEach(post => {
                        let dateStr = '日期未知';
                        try {
                            const d = new Date(post.date);
                            dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                        } catch(e) {}
                        
                        const postPath = post.path.startsWith('/') ? post.path : '/' + post.path;
                        const articleLink = `/post-template.html?path=${encodeURIComponent(postPath)}`;
                        const thumbnail = post.thumbnail || '/images/default-post.jpg';
                        
                        postsHtml += `
                            <li class="post-item">
                                <div class="post-image">
                                    <img src="${thumbnail}" alt="${post.title}" loading="lazy">
                                </div>
                                <div class="post-content">
                                    <a href="${articleLink}" class="post-title">${post.title || '无标题'}</a>
                                    <div class="post-footer">
                                        <span class="post-date">${dateStr}</span>
                                    </div>
                                </div>
                            </li>
                        `;
                    });
                    
                    container.innerHTML = `
                        <div>
                            <a href="/categories/" class="back-link">← 返回分类列表</a>
                            <ul class="posts-list">${postsHtml}</ul>
                        </div>
                    `;
                })
                .catch(error => {
                    container.innerHTML = `
                        <div>
                            <a href="/categories/" class="back-link">← 返回分类列表</a>
                            <div class="error-state"><h3>⚠️ 加载失败</h3><p>${error.message}</p></div>
                        </div>
                    `;
                });
        }

        // ===== 主题切换功能 =====
        (function() {
            const toggleBtn = document.getElementById('theme-toggle');
            const iconSpan = document.getElementById('theme-icon');
            const htmlElement = document.documentElement;

            function applyTheme(theme) {
                if (theme === 'dark') {
                    htmlElement.classList.add('dark');
                    iconSpan.textContent = '☀️';
                } else {
                    htmlElement.classList.remove('dark');
                    iconSpan.textContent = '🌙';
                }
                localStorage.setItem('theme', theme);
            }

            function getCurrentTheme() {
                return htmlElement.classList.contains('dark') ? 'dark' : 'light';
            }

            function toggleTheme() {
                const current = getCurrentTheme();
                const next = current === 'dark' ? 'light' : 'dark';
                applyTheme(next);
            }

            function initTheme() {
                const stored = localStorage.getItem('theme');
                if (stored === 'dark' || stored === 'light') {
                    applyTheme(stored);
                    return;
                }
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                applyTheme(prefersDark ? 'dark' : 'light');
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    toggleTheme();
                });
            }

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });

            initTheme();
        })();

        // ===== 页面初始化 =====
        (function() {
            const selectedCat = getUrlParam('cat');
            if (selectedCat) {
                loadCategoryDetail(selectedCat);
            } else {
                loadCategories();
            }
        })();
    </script>
</body>
</html>
